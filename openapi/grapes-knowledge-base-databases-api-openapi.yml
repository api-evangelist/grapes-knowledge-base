components:
  schemas:
    RelationDto:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
        fromTable:
          type:
          - string
          - 'null'
        toTable:
          type:
          - string
          - 'null'
        columnMappings:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/RelationColumnMappingDto'
      additionalProperties: false
    DatabaseEnvironmentRequest:
      type: object
      properties:
        environmentId:
          type:
          - string
          - 'null'
        infrastructureId:
          type:
          - string
          - 'null'
      additionalProperties: false
    UpdateSchemaRequest:
      type: object
      properties:
        tables:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/TableDto'
        relations:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/RelationDto'
        uniqueIndexes:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/UniqueIndexDto'
      additionalProperties: false
    DatabaseDto:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
        type:
          $ref: '#/components/schemas/DataBaseTypes'
        environments:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/DatabaseEnvironmentDto'
      additionalProperties: false
    DatabaseDtoItemResponse:
      type: object
      properties:
        item:
          $ref: '#/components/schemas/DatabaseDto'
        links:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/HateoasLink'
      additionalProperties: false
    DatabaseEnvironmentDto:
      type: object
      properties:
        environmentId:
          type:
          - string
          - 'null'
        infrastructureId:
          type:
          - string
          - 'null'
      additionalProperties: false
    FieldDto:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
        dataType:
          type:
          - string
          - 'null'
        innerDataType:
          type:
          - string
          - 'null'
        dataTypeGroup:
          $ref: '#/components/schemas/DataTypeGroup'
        nullable:
          type: boolean
        isAutoGenerated:
          type: boolean
        isComputed:
          type: boolean
        isPrimaryKey:
          type: boolean
      additionalProperties: false
    ExtractSchemaRequest:
      type: object
      properties:
        databaseEnvironmentId:
          type:
          - string
          - 'null'
      additionalProperties: false
    IActionResult:
      type: object
      additionalProperties: false
    SchemaDto:
      type: object
      properties:
        tables:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/TableDto'
        relations:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/RelationDto'
        uniqueIndexes:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/UniqueIndexDto'
      additionalProperties: false
    HateoasLink:
      type: object
      properties:
        relation:
          type:
          - string
          - 'null'
        uri:
          type:
          - string
          - 'null'
        method:
          type:
          - string
          - 'null'
      additionalProperties: false
    UniqueIndexColumnDto:
      type: object
      properties:
        ordinal:
          type: integer
          format: int32
        name:
          type:
          - string
          - 'null'
      additionalProperties: false
    SchemaDtoItemResponse:
      type: object
      properties:
        item:
          $ref: '#/components/schemas/SchemaDto'
        links:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/HateoasLink'
      additionalProperties: false
    RelationColumnMappingDto:
      type: object
      properties:
        fromColumn:
          type:
          - string
          - 'null'
        toColumn:
          type:
          - string
          - 'null'
      additionalProperties: false
    DatabaseDtoListItemResponse:
      type: object
      properties:
        items:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/DatabaseDtoItemResponse'
        totalCount:
          type: integer
          format: int32
      additionalProperties: false
    DataBaseTypes:
      enum:
      - SqlServer
      - MySql
      type: string
    UpdateDatabaseRequest:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
        type:
          $ref: '#/components/schemas/DataBaseTypes'
        environments:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/DatabaseEnvironmentRequest'
      additionalProperties: false
    UniqueIndexDto:
      type: object
      properties:
        table:
          type:
          - string
          - 'null'
        indexName:
          type:
          - string
          - 'null'
        columns:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/UniqueIndexColumnDto'
      additionalProperties: false
    TableDto:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
        fields:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/FieldDto'
      additionalProperties: false
    DataTypeGroup:
      enum:
      - String
      - Number
      - Boolean
      - Date
      - Binary
      - Unknown
      type: string
    CreateDatabaseRequest:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
        type:
          $ref: '#/components/schemas/DataBaseTypes'
        environments:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/DatabaseEnvironmentRequest'
      additionalProperties: false
  securitySchemes:
    Bearer:
      type: oauth2
      description: "JWT Authorization header using the Bearer scheme. \n\n Enter 'Bearer' [space] and then your token in the text input below.\n\nExample: \"Bearer 1safsfsdfdfd\""
