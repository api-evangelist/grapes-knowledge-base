      operationId: GetGrapesById
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      - name: projId
        in: path
        required: true
        schema:
          type: string
      - name: Id
        in: path
        required: true
        schema:
          type: string
      - name: includeDatabases
        in: query
