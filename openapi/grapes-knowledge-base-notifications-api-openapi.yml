openapi: 3.2.0
info:
  title: Grapes Notifications API
  version: v1
security:
- Bearer: []
tags:
- name: Notifications
paths:
  /api/{version}/organizations/{orgId}/notifications:
    get:
      tags:
      - Notifications
      operationId: GetNotifications
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      - name: Channel
        in: query
        schema:
          $ref: '#/components/schemas/NotificationChannel'
      - name: Status
        in: query
        schema:
          $ref: '#/components/schemas/NotificationStatus'
      - name: skip
        in: query
        schema:
          type: integer
          format: int32
      - name: take
        in: query
        schema:
          type: integer
          format: int32
      - name: version
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/NotificationDtoListItemResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationDtoListItemResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/NotificationDtoListItemResponse'
      summary: Get notifications
      x-summary-source: derived
  /api/{version}/organizations/{orgId}/notifications/dismiss:
    post:
      tags:
      - Notifications
      operationId: DismissNotification
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      - name: version
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/IActionResultTask'
            application/json:
              schema:
                $ref: '#/components/schemas/IActionResultTask'
            text/json:
              schema:
                $ref: '#/components/schemas/IActionResultTask'
      summary: Dismiss notification
      x-summary-source: derived
