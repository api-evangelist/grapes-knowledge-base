components:
  schemas:
    AgentStatusTypes:
      enum:
      - Unknown
      - Up
      - Down
      - Stopped
      - Running
      type: string
    AgentPoolDto:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
        type:
          $ref: '#/components/schemas/AgentPoolTypes'
      additionalProperties: false
    AgentDto:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
        status:
          $ref: '#/components/schemas/AgentStatusTypes'
        lastSeenDate:
          type:
          - string
          - 'null'
          format: date-time
        identity:
          type:
          - string
          - 'null'
        version:
          type:
          - string
          - 'null'
      additionalProperties: false
    ActionResult:
      type: object
      additionalProperties: false
    AgentPoolTypes:
      enum:
      - GrapesAgent
      - SelfHosted
      type: string
    AgentDtoItemResponse:
      type: object
      properties:
        item:
          $ref: '#/components/schemas/AgentDto'
        links:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/HateoasLink'
      additionalProperties: false
    AgentDtoListItemResponse:
      type: object
      properties:
        items:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/AgentDtoItemResponse'
        totalCount:
          type: integer
          format: int32
      additionalProperties: false
    IActionResult:
      type: object
      additionalProperties: false
    AgentPoolDtoListItemResponse:
      type: object
      properties:
        items:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/AgentPoolDtoItemResponse'
        totalCount:
          type: integer
          format: int32
      additionalProperties: false
    UpdateAgentRequest:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/AgentStatusTypes'
        version:
          type:
          - string
          - 'null'
      additionalProperties: false
    HateoasLink:
      type: object
      properties:
        relation:
          type:
          - string
          - 'null'
        uri:
          type:
          - string
          - 'null'
        method:
          type:
          - string
          - 'null'
      additionalProperties: false
    CreateAgentPoolRequest:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
      additionalProperties: false
    CreateAgentRequest:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
      additionalProperties: false
    AgentPoolDtoItemResponse:
      type: object
      properties:
        item:
          $ref: '#/components/schemas/AgentPoolDto'
        links:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/HateoasLink'
      additionalProperties: false
  securitySchemes:
    Bearer:
      type: oauth2
      description: "JWT Authorization header using the Bearer scheme. \n\n Enter 'Bearer' [space] and then your token in the text input below.\n\nExample: \"Bearer 1safsfsdfdfd\""
