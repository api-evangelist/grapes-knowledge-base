            text/json:
              schema:
                $ref: '#/components/schemas/IActionResult'
        '400':
          description: Validation failed
        '404':
          description: Dataset not found
      summary: Import dataset
      x-summary-source: derived
  /api/{version}/organizations/{orgId}/projects/{projId}/grapes/{grapeId}/datasets/{id}/upload:
    post:
      tags:
      - Datasets
      operationId: UploadDataset
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      - name: projId
        in: path
        required: true
        schema:
          type: string
      - name: grapeId
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: version
        in: path
        required: true
        schema:
          type: string
      responses:
        '202':
          description: Accepted
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/IActionResult'
            application/json:
              schema:
                $ref: '#/components/schemas/IActionResult'
            text/json:
              schema:
                $ref: '#/components/schemas/IActionResult'
        '400':
          description: Validation failed
        '404':
          description: Dataset not found
        '415':
          description: Content-Type not supported
      summary: Upload dataset
      x-summary-source: derived
  /api/{version}/organizations/{orgId}/projects/{projId}/grapes/{grapeId}/datasets/{id}/download:
    get:
      tags:
