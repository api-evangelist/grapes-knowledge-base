openapi: 3.2.0
info:
  title: Grapes Datasets API
  version: v1
security:
- Bearer: []
tags:
- name: Datasets
paths:
  /api/{version}/organizations/{orgId}/projects/{projId}/grapes/{grapeId}/datasets:
    get:
      tags:
      - Datasets
      operationId: GetDatasets
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      - name: projId
        in: path
        required: true
        schema:
          type: string
      - name: grapeId
        in: path
        required: true
        schema:
          type: string
      - name: version
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/DatasetDtoListItemResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetDtoListItemResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/DatasetDtoListItemResponse'
      summary: Get datasets
      x-summary-source: derived
    post:
      tags:
      - Datasets
      operationId: CreateDataset
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      - name: projId
        in: path
        required: true
        schema:
          type: string
      - name: grapeId
        in: path
        required: true
        schema:
          type: string
      - name: version
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDatasetRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/CreateDatasetRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/CreateDatasetRequest'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/DatasetDtoItemResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetDtoItemResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/DatasetDtoItemResponse'
        '400':
          description: Validation failed
      summary: Create dataset
      x-summary-source: derived
  /api/{version}/organizations/{orgId}/projects/{projId}/grapes/{grapeId}/datasets/{id}:
    get:
      tags:
      - Datasets
      operationId: GetDatasetById
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      - name: projId
        in: path
        required: true
        schema:
          type: string
      - name: grapeId
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: version
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/DatasetDtoItemResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetDtoItemResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/DatasetDtoItemResponse'
        '404':
          description: Dataset not found
      summary: Get dataset by id
      x-summary-source: derived
    put:
      tags:
      - Datasets
      operationId: UpdateDataset
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      - name: projId
        in: path
        required: true
        schema:
          type: string
      - name: grapeId
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: version
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDatasetRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/UpdateDatasetRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/UpdateDatasetRequest'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/DatasetDtoItemResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetDtoItemResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/DatasetDtoItemResponse'
        '400':
          description: Validation failed
        '404':
          description: Dataset not found
      summary: Update dataset
      x-summary-source: derived
    delete:
      tags:
      - Datasets
      operationId: DeleteDataset
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      - name: projId
        in: path
        required: true
        schema:
          type: string
      - name: grapeId
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: version
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Validation failed
        '404':
          description: Dataset not found
      summary: Delete dataset
      x-summary-source: derived
  /api/{version}/organizations/{orgId}/projects/{projId}/grapes/{grapeId}/datasets/{id}/extract-data:
    post:
      tags:
      - Datasets
      operationId: ExtractDataset
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      - name: projId
        in: path
        required: true
        schema:
          type: string
      - name: grapeId
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: version
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtractDataRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/ExtractDataRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ExtractDataRequest'
      responses:
        '202':
          description: Accepted
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/IActionResult'
            application/json:
              schema:
                $ref: '#/components/schemas/IActionResult'
            text/json:
              schema:
                $ref: '#/components/schemas/IActionResult'
        '400':
          description: Validation failed
        '404':
          description: Dataset not found
      summary: Extract dataset
      x-summary-source: derived
  /api/{version}/organizations/{orgId}/projects/{projId}/grapes/{grapeId}/datasets/{id}/import-data:
    post:
