components:
  schemas:
    DatasetStatusTypes:
      enum:
      - Empty
      - InProgress
      - Ready
      - Error
      type: string
    ImportDatasetRequest:
      type: object
      properties:
        targetEnvironmentId:
          type:
          - string
          - 'null'
      additionalProperties: false
    DatasetParameterValueDto:
      type: object
      properties:
        parmeterId:
          type:
          - string
          - 'null'
        value:
          type:
          - string
          - 'null'
      additionalProperties: false
    CreateDatasetRequest:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
        parameters:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/DatasetParameterValueDto'
      additionalProperties: false
    DatasetDtoListItemResponse:
      type: object
      properties:
        items:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/DatasetDtoItemResponse'
        totalCount:
          type: integer
          format: int32
      additionalProperties: false
    DatasetDto:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
        status:
          $ref: '#/components/schemas/DatasetStatusTypes'
        latestExecutionDate:
          type:
          - string
          - 'null'
          format: date-time
        size:
          type:
          - integer
          - 'null'
          format: int64
        parameters:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/DatasetParameterValueDto'
      additionalProperties: false
    IActionResult:
      type: object
      additionalProperties: false
    HateoasLink:
      type: object
      properties:
        relation:
          type:
          - string
          - 'null'
        uri:
          type:
          - string
          - 'null'
        method:
          type:
          - string
          - 'null'
      additionalProperties: false
    UpdateDatasetRequest:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
        status:
          $ref: '#/components/schemas/DatasetStatusTypes'
        latestExecutionDate:
          type:
          - string
          - 'null'
          format: date-time
        size:
          type:
          - integer
          - 'null'
          format: int64
        parameters:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/DatasetParameterValueDto'
      additionalProperties: false
    ExtractDataRequest:
      type: object
      properties:
        environmentId:
          type:
          - string
          - 'null'
      additionalProperties: false
    DatasetDtoItemResponse:
      type: object
      properties:
        item:
          $ref: '#/components/schemas/DatasetDto'
        links:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/HateoasLink'
      additionalProperties: false
  securitySchemes:
    Bearer:
      type: oauth2
      description: "JWT Authorization header using the Bearer scheme. \n\n Enter 'Bearer' [space] and then your token in the text input below.\n\nExample: \"Bearer 1safsfsdfdfd\""
