        schema:
          type: string
      - name: projId
        in: path
        required: true
        schema:
          type: string
      - name: grapeId
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: version
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
